name: gymtrx
description: Gym training tracker
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  flutter_local_notifications:  ^17.2.1

  # Storage
  shared_preferences: ^2.2.3

  # IDs
  uuid: ^4.4.0

  # Media
  image_picker: ^1.0.7

  # Charts
  fl_chart: ^0.66.2

  # CSV import
  csv: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/exercises.csv
    - assets/logo.png
    - assets/app_icon/gymtrx_icon.png
    - assets/sounds/bel.mp3
    - assets/ui/background_texture.png
    - assets/ui/gymtrx_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/gymtrx_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/app_icon/gymtrx_icon.png"
